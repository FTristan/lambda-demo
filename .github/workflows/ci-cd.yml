name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    needs: lint
    uses: ./.github/workflows/test.yml

  terraform:
    needs: test
    uses: ./.github/workflows/terraform.yml

  docker:
    needs: terraform
    uses: ./.github/workflows/docker.yml
